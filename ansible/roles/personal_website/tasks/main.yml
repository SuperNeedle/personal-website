---
- name: Ensure /var/www/personal-website git repository is cloned
  ansible.builtin.git:
    repo: "git@github.com:SuperNeedle/personal-website.git"
    dest: /var/www/personal-website
    version: main
    accept_hostkey: true
  become_user: homelab

- name: Check if .env file exists
  ansible.builtin.stat:
    path: /var/www/personal-website/.env
  register: env_file_stat

- name: Fail if .env file does not exist
  ansible.builtin.fail:
    msg: ".env must be created manually on first deploy — see docs/DOCUMENTATION.md for required values, this cannot be auto-generated safely"
  when: not env_file_stat.stat.exists

# Using ansible.builtin.command with chdir instead of community.general.podman_compose
# because podman-compose is already installed as a native DNF package in the common role,
# avoiding external Ansible Galaxy collection dependencies while running with non-root homelab privileges.
- name: Build and start container services via podman-compose
  ansible.builtin.command: podman-compose up -d --build
  args:
    chdir: /var/www/personal-website
  become_user: homelab

# Known gap: cloudflared binary installation is not yet scripted via Ansible.
# It must be manually installed to /usr/local/bin/cloudflared prior to running this playbook.
- name: Verify /usr/local/bin/cloudflared binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/cloudflared
  register: cloudflared_bin_stat

- name: Fail if cloudflared binary is missing
  ansible.builtin.fail:
    msg: "/usr/local/bin/cloudflared binary not found. Please install cloudflared manually first (e.g. curl -L --output /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x /usr/local/bin/cloudflared)."
  when: not cloudflared_bin_stat.stat.exists

- name: Apply correct SELinux context to cloudflared binary
  ansible.builtin.command: restorecon -v /usr/local/bin/cloudflared
  register: restorecon_result
  changed_when: restorecon_result.stdout != ""

- name: Ensure /etc/cloudflared directory exists
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template /etc/cloudflared/config.yml
  ansible.builtin.template:
    src: cloudflared-config.yml.j2
    dest: /etc/cloudflared/config.yml
    owner: root
    group: root
    mode: "0644"

- name: Ensure cloudflared systemd service is enabled and started
  ansible.builtin.systemd:
    name: cloudflared
    enabled: true
    state: started
