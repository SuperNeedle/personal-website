---
- name: Ensure /var/www/personal-website git repository is cloned
  ansible.builtin.git:
    repo: "git@github.com:SuperNeedle/personal-website.git"
    dest: /var/www/personal-website
    version: main
    accept_hostkey: true
  become_user: homelab

- name: Check if .env file exists
  ansible.builtin.stat:
    path: /var/www/personal-website/.env
  register: env_file_stat

- name: Fail if .env file does not exist
  ansible.builtin.fail:
    msg: ".env must be created manually on first deploy — see docs/SOFTWARE_DOCUMENTATION.md for required values, this cannot be auto-generated safely"
  when: not env_file_stat.stat.exists

# Using ansible.builtin.command with chdir instead of community.general.podman_compose
# because podman-compose is already installed as a native DNF package in the common role,
# avoiding external Ansible Galaxy collection dependencies while running with non-root homelab privileges.
# podman-compose up -d --build alone does not reliably recreate the running container from a freshly built image — an explicit down before build/up guarantees the container is recreated. Confirmed via testing on 2026-09-13; normal layer caching (no --no-cache needed) works correctly once this pattern is used.
- name: Tear down existing container services via podman-compose
  ansible.builtin.command: podman-compose down
  args:
    chdir: /var/www/personal-website
  become_user: homelab
  failed_when: false

- name: Build container images via podman-compose
  ansible.builtin.command: podman-compose build
  args:
    chdir: /var/www/personal-website
  become_user: homelab

- name: Start container services via podman-compose
  ansible.builtin.command: podman-compose up -d
  args:
    chdir: /var/www/personal-website
  become_user: homelab

- name: Ensure cloudflared binary is installed
  ansible.builtin.get_url:
    url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
    dest: /usr/local/bin/cloudflared
    mode: '0755'

- name: Apply correct SELinux context to cloudflared binary
  ansible.builtin.command: restorecon -v /usr/local/bin/cloudflared
  register: restorecon_result
  changed_when: restorecon_result.stdout != ""

- name: Ensure /etc/cloudflared directory exists
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template /etc/cloudflared/config.yml
  ansible.builtin.template:
    src: cloudflared-config.yml.j2
    dest: /etc/cloudflared/config.yml
    owner: root
    group: root
    mode: "0644"

- name: Ensure cloudflared systemd service is enabled and started
  ansible.builtin.systemd:
    name: cloudflared
    enabled: true
    state: started
